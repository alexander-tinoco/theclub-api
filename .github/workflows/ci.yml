name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: make lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: make typecheck

  # Contrato versionado en contracts/openapi.json (scripts/export_openapi.py):
  # sin DB ni Kafka -- app.openapi() solo introspecciona rutas, no toca IO.
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: make openapi-check

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  test:
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://theclub:theclub@localhost:5432/theclub
      # Sin .env en el checkout, docker-compose.yml usa su default
      # (REDIS_PORT=6389) -- no el 6379 nativo del contenedor.
      REDIS_URL: redis://localhost:6389/0
      KAFKA_BOOTSTRAP_SERVERS: localhost:19092
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked

      # El mismo docker-compose.yml que en local, no un `docker run` aparte:
      # tests/integration/test_kafka_outage.py controla Redpanda con
      # `docker compose stop/start redpanda` -- necesita que sea *ese*
      # comando el que lo haya levantado, o no encuentra el contenedor.
      # `--wait` bloquea hasta que los tres healthchecks pasan, igual que
      # hace `depends_on: condition: service_healthy` para `api` en local.
      - name: Levantar Postgres, Redis y Redpanda
        run: docker compose up -d postgres redis redpanda --wait

      - name: Migrar la base de datos
        run: make db-upgrade
      - name: alembic check (deriva entre modelos y migraciones)
        run: make db-check

      - name: Tests con cobertura
        run: make test-cov
