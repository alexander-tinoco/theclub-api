name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: make lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: make typecheck

  # Contract versioned in contracts/openapi.json (scripts/export_openapi.py):
  # no DB or Kafka needed -- app.openapi() only introspects routes, no IO.
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: make openapi-check

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  test:
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://theclub:theclub@localhost:5432/theclub
      # No .env in the checkout, so docker-compose.yml uses its default
      # (REDIS_PORT=6389) -- not the container's native 6379.
      REDIS_URL: redis://localhost:6389/0
      KAFKA_BOOTSTRAP_SERVERS: localhost:19092
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked

      # The same docker-compose.yml as local, not a separate `docker run`:
      # tests/integration/test_kafka_outage.py controls Redpanda with
      # `docker compose stop/start redpanda` -- it needs to be *that*
      # command that brought it up, or it can't find the container.
      # `--wait` blocks until all three healthchecks pass, same as
      # `depends_on: condition: service_healthy` does for `api` locally.
      - name: Bring up Postgres, Redis, and Redpanda
        run: docker compose up -d postgres redis redpanda --wait

      - name: Migrate the database
        run: make db-upgrade
      - name: alembic check (drift between models and migrations)
        run: make db-check

      - name: Tests with coverage
        run: make test-cov
