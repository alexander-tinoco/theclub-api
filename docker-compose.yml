name: theclub

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: theclub
      POSTGRES_PASSWORD: theclub
      POSTGRES_DB: theclub
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U theclub -d theclub"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  redpanda:
    image: redpandadata/redpanda:v24.2.7
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --default-log-level=warn
      # Dos listeners a propósito: `internal` es el que usan los otros
      # contenedores por nombre de servicio, `external` el que usas tú desde el
      # host. Anunciar solo uno es el fallo clásico de Kafka en Docker: o no
      # conecta la API, o no conectan los tests.
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
    ports:
      - "${KAFKA_PORT:-19092}:19092"
      - "${REDPANDA_ADMIN_PORT:-9644}:9644"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 15s

  console:
    image: redpandadata/console:v2.7.2
    environment:
      KAFKA_BROKERS: redpanda:9092
    ports:
      - "${CONSOLE_PORT:-8090}:8080"
    depends_on:
      redpanda:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    command: redis-server --save "" --appendonly no
    ports:
      - "${REDIS_PORT:-6389}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  api:
    build:
      context: .
      target: runtime
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: local
      # Dentro de la red de compose se usan los nombres de servicio, no localhost.
      DATABASE_URL: postgresql+psycopg://theclub:theclub@postgres:5432/theclub
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      REDIS_URL: redis://redis:6379/0
    ports:
      - "${API_PORT:-8010}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres-data:
  redpanda-data:
