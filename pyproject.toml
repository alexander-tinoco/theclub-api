[project]
name = "theclub-api"
version = "0.1.0"
description = "Motor de juego de The Club: resuelve rondas, gestiona balances y publica eventos a Kafka."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic-settings>=2.5",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "watchfiles>=0.24",
]

[tool.uv]
package = false

# ---------------------------------------------------------------- lint / format

[tool.ruff]
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # bugbear
    "C4",       # comprehensions
    "SIM",      # simplify
    "RUF",      # ruff
    "ASYNC",    # errores de async
    "S",        # bandit
    "T20",      # nada de print()
]
ignore = [
    "S101",  # assert: legítimo en tests
]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]  # credenciales de prueba hardcodeadas

# ------------------------------------------------------------------- tipos

[tool.mypy]
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
files = ["app", "tests"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# ------------------------------------------------------------------- tests

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-ra --strict-markers --strict-config"
markers = [
    "unit: puro, sin IO ni servicios externos",
    "integration: necesita Postgres y/o Redpanda levantados",
    "e2e: recorre la API completa de punta a punta",
]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]
