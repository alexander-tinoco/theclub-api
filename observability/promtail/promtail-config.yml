# Descubre contenedores vía el socket de Docker (montado read-only en el
# servicio `promtail` de docker-compose) en vez de listar servicios a mano
# -- un contenedor nuevo se recoge solo, sin tocar este archivo.
server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: "container"
    # `configure_logging` (app/infra/logging.py) emite una línea JSON por
    # evento -- de ahí sale la etiqueta `level`, sin tocar la app para nada.
    # Si una línea no es JSON válido (otro contenedor, un traceback multilínea),
    # esta etapa simplemente no le añade la etiqueta; no descarta la línea.
    pipeline_stages:
      - json:
          expressions:
            level: level
      - labels:
          level:
