# Discovers containers via the Docker socket (mounted read-only in the
# `promtail` service of docker-compose) instead of listing services by hand
# -- a new container gets picked up on its own, without touching this file.
server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: "container"
    # `configure_logging` (app/infra/logging.py) emits one JSON line per
    # event -- that's where the `level` label comes from, without touching
    # the app at all. If a line isn't valid JSON (another container, a
    # multi-line traceback), this stage just doesn't add the label to it;
    # it doesn't drop the line.
    pipeline_stages:
      - json:
          expressions:
            level: level
      - labels:
          level:
