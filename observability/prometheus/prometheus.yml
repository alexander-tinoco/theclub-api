# Scrapes the API's /metrics inside the docker-compose network. The service
# name (`api`) only resolves there -- that's why this file doesn't work for
# pointing Prometheus at the API from outside compose.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: theclub-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
