# All on metrics that /metrics already exposes (app/infra/metrics.py) --
# no alert here depends on something that isn't already visible on the
# Grafana dashboard today. The one deliberately missing -- outbox backlog --
# needs a metric that doesn't exist yet; it's added in a separate phase, not here.
groups:
  - name: theclub-api
    rules:
      - alert: APIDown
        expr: up{job="theclub-api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "theclub-api isn't responding to Prometheus"
          description: "The theclub-api target has been unscrapable for more than 1m."

      - alert: HighErrorRate
        expr: |
          sum(rate(http_requests_total{status_code=~"5.."}[5m]))
          /
          sum(rate(http_requests_total[5m]))
          > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "5xx error rate above 5%"
          description: "More than 5% of requests over the last 5m ended in a 5xx."

      - alert: HighLatencyP95
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(http_request_duration_seconds_bucket[5m]))
          ) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "p95 latency above 1s"
          description: "The 95th percentile of request duration has been above 1s for 5m."

      - alert: WsConnectionsNearLimit
        expr: ws_connections_active / ws_connections_limit > 0.9
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "WebSocket connections near the configured limit"
          description: "ws_connections_active exceeded 90% of WS_MAX_CONNECTIONS for 2m."
