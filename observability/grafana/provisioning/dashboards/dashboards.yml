# Tells Grafana where to look for the dashboard JSON files versioned in the
# repo (see ../../dashboards/) -- so the dashboard exists from the very
# first startup, without building it by hand in the UI.
apiVersion: 1

providers:
  - name: theclub-api
    orgId: 1
    folder: ""
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
