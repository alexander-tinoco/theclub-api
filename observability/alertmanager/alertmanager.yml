# With no real external channel to wire up in a portfolio project, the
# default receiver ("default") doesn't send anything out -- alerts are still
# visible in Alertmanager's own UI (http://localhost:9093) and in Grafana
# (the "Alertmanager" datasource, provisioned alongside Prometheus and
# Loki). Wiring up real Slack means adding `slack_configs` with a real
# `api_url` under the "default" receiver -- nothing else in this config or
# in the Prometheus rules needs to change.
route:
  receiver: default
  group_by: ["alertname"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: default
